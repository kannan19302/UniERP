name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  links:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The landing README is the front door: every repository is linked from it,
      # so a stale link here is the first thing a new reader hits. Checking that
      # the community files GitHub surfaces are actually present stops the repo
      # from quietly losing its issue templates or security policy.
      - name: Required community files are present
        run: |
          for f in README.md LICENSE SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md \
                   profile/README.md .github/ISSUE_TEMPLATE/bug_report.yml \
                   .github/ISSUE_TEMPLATE/feature_request.yml; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          echo "all community files present"
      # profile/ is a published copy, not a second source of truth. Checking
      # only README.md let ARCHITECTURE.md drift unnoticed, so check every file
      # the sync script writes, and name the fix in the failure message.
      - name: Published profile matches the repository root
        run: |
          status=0
          for f in README.md ARCHITECTURE.md; do
            diff -q "$f" "profile/$f" >/dev/null 2>&1 || {
              echo "::error file=profile/$f::profile/$f has drifted from $f — run scripts/sync-profile.sh and commit the result"
              status=1
            }
          done
          exit $status
