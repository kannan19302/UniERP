name: Bug report
description: Something behaves incorrectly
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        **Security issues do not belong here.** If this is a vulnerability —
        especially anything touching tenant isolation, authentication, or the
        extension sandbox — follow `SECURITY.md` instead. A public issue on a
        cross-tenant bug tells every operator and every attacker at the same time.
  - type: dropdown
    id: repo
    attributes:
      label: Which layer
      options:
        - unierp-api (backend)
        - unierp-web (customer app)
        - unierp-console (platform admin)
        - unierp-mobile
        - unierp-data (schema / migrations)
        - unierp-design-system
        - unierp-extension-api / sandbox
        - unierp-infra (deployment)
        - Not sure
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations: { required: true }
  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      description: Include the exact error, status code, and correlation id if you have one.
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Log in as a tenant admin
        2. Go to Finance → Invoices
        3. …
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Commit
      description: >-
        There are no tagged releases yet, so the commit SHA you are running is
        what identifies your build. `git rev-parse --short HEAD`.
      placeholder: "a1b2c3d"
    validations: { required: true }
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        Say whether you are running the ERPSys monorepo or an extracted
        repository. An extracted repository failing `npm install` with
        `EUNSUPPORTEDPROTOCOL` is a known state of the migration, not a bug —
        see ROADMAP.md.
      placeholder: |
        Running: ERPSys monorepo
        OS:      Ubuntu 24.04
        Node:    20.11.0
        pnpm:    9.1.0
        Docker:  26.1.0
      render: text
    validations: { required: true }
  - type: checkboxes
    id: tenancy
    attributes:
      label: Does this involve more than one tenant?
      description: If data from one tenant appeared under another, stop and read SECURITY.md.
      options:
        - label: This bug involves data or access across tenants
