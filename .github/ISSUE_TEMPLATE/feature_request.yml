name: Feature request
description: Suggest a capability
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you solving
      description: The business situation, not the implementation you have in mind.
    validations: { required: true }
  - type: textarea
    id: today
    attributes:
      label: How do you handle it today
    validations: { required: true }
  - type: dropdown
    id: tier
    attributes:
      label: Could an extension do this instead?
      description: >
        UniERP offers three extension tiers — configure, compose (low-code), and
        code (sandboxed). If a tier already covers it, that ships faster than a
        core change and does not add surface to the platform.
      options:
        - "No — it needs core platform support"
        - "Maybe — I am not sure which tier applies"
        - "Yes — but the tier is missing something"
    validations: { required: true }
