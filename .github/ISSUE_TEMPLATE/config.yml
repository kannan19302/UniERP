blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/kannan19302/UniERP/security/advisories/new
    about: Report privately. Never open a public issue for a tenant-isolation, control-plane or auth flaw.
  - name: Question, or help running it
    url: https://github.com/kannan19302/UniERP/discussions
    about: Ask here rather than opening an issue. Answers stay public for the next person.
  - name: What to include, and what response to expect
    url: https://github.com/kannan19302/UniERP/blob/main/SUPPORT.md
    about: One maintainer, no SLA. This says plainly what that means.
  - name: Deployment and operations
    url: https://github.com/kannan19302/unierp-infra
    about: Compose, Kubernetes, ingress, runbooks. Open infrastructure issues there.
  - name: Bug in a specific repository
    url: https://github.com/kannan19302/UniERP#repository-map
    about: UniERP is a polyrepo. Report API, web or data bugs in the repo that owns the code.
