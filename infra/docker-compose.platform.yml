          target: /app/src
        - action: sync
          path: ../tenant-admin/public
          target: /app/public
        - action: sync
          path: ../tenant-admin/next.config.mjs
          target: /app/next.config.mjs
    ports:
      - "4003:4003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
      idp:
        condition: service_started

  # ════════════════════════════════════════════════════════════════════════
  # PLATFORM 7 — Marketplace (port 4007)
  # ════════════════════════════════════════════════════════════════════════

  marketplace:
    build:
      context: ../developer-platform/marketplace
      target: dev
      args:
        <<: *registry
        API_URL: http://api:3001
        IDP_URL: http://idp:3005
      # Lets the dev target overlay the LOCAL shared/design-system packages over
      # the published ones — see the `localdeps` stage in this service's
      # Dockerfile. shared/auth-client and ui/shell exist locally but not in the
      # published tarballs of the same version. Kept as a named context rather
      # than widening `context:` so a plain `docker build` in the service
      # directory still works unchanged.
      additional_contexts:
        localpkgs: ..
    container_name: marketplace
    restart: unless-stopped
    profiles: ["customer", "l4", "full"]
    mem_limit: 1500m
    environment:
      <<: *frontend-env
    volumes:
      - ../marketplace/app:/app/app
      - ../marketplace/src:/app/src
      - ../marketplace/public:/app/public
      - ../marketplace/next.config.mjs:/app/next.config.mjs
    develop:
      watch:
        - action: sync
          path: ../marketplace/app
          target: /app/app
        - action: sync
          path: ../marketplace/src
          target: /app/src
        - action: sync
          path: ../marketplace/public
          target: /app/public
        - action: sync
          path: ../marketplace/next.config.mjs
          target: /app/next.config.mjs
    ports:
      - "4005:4005"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
      idp:
        condition: service_started

  # ════════════════════════════════════════════════════════════════════════
  # PLATFORM 8 — Developer Platform (port 4008)
  # ════════════════════════════════════════════════════════════════════════

  developer-platform:
    build:
      context: ../developer-platform
      target: dev
      args:
        <<: *registry
        API_URL: http://api:3001
      # Lets the dev target overlay the LOCAL shared/design-system packages over
      # the published ones — see the `localdeps` stage in this service's
      # Dockerfile. shared/auth-client and ui/shell exist locally but not in the
      # published tarballs of the same version. Kept as a named context rather
      # than widening `context:` so a plain `docker build` in the service
      # directory still works unchanged.
      additional_contexts:
        localpkgs: ..
    container_name: developer-platform
    restart: unless-stopped
    profiles: ["l4", "full"]
    mem_limit: 2g
    environment:
      <<: *frontend-env
    volumes:
      - ../developer-platform/src:/app/src
      - ../developer-platform/public:/app/public
      - ../developer-platform/next.config.mjs:/app/next.config.mjs
    develop:
      watch:
        - action: sync
          path: ../developer-platform/src
          target: /app/src
        - action: sync
          path: ../developer-platform/public
          target: /app/public
        - action: sync
          path: ../developer-platform/next.config.mjs
          target: /app/next.config.mjs
    ports:
      - "4004:4004"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_started

  # ════════════════════════════════════════════════════════════════════════
  # PLATFORM 9 — Mobile App (port 4009)
  # ════════════════════════════════════════════════════════════════════════

  mobile:
    build:
      context: ../mobile
      target: dev
      args:
        API_BASE_URL: http://api:3001
    container_name: mobile
    restart: unless-stopped
    profiles: ["customer", "l5", "full"]
    mem_limit: 1g
    volumes:
      - ../mobile/lib:/app/lib
      - ../mobile/assets:/app/assets
      - ../mobile/web:/app/web
    ports:
      - "4009:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_started

  # ════════════════════════════════════════════════════════════════════════
  # PLATFORM 10 — Desktop App (port 4010)
  # ════════════════════════════════════════════════════════════════════════

  desktop-app:
    build:
      context: ../desktop-app
      target: dev
    container_name: desktop-app
    restart: unless-stopped
    profiles: ["customer", "l5", "full"]
    mem_limit: 1g
    environment:
      PORT: "4010"
      HOST: "0.0.0.0"
      NODE_ENV: development
    volumes:
      - ../desktop-app/public:/app/public
    ports:
      - "4007:4007"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_started

  # ════════════════════════════════════════════════════════════════════════
  # SUPPORT — Storybook (port 6006)
  # ════════════════════════════════════════════════════════════════════════

  storybook:
    build:
      context: ../design-system/storybook
      target: dev
      args: *registry
    container_name: storybook
    restart: unless-stopped
    profiles: ["full"]
    mem_limit: 1g
    environment:
      <<: *watch-env
      NODE_ENV: development
    # /design-system/src, NOT /unierp-design-system/src. .storybook/main.ts globs
    # '../../design-system/src/**/*.stories.@(ts|tsx)' and aliases
    # @kannan19302/ui to the same path — both relative to /app/.storybook, which
    # resolves to /design-system/src. Nothing in this repo ever referenced
    # /unierp-design-system, so the 49 story files were mounted somewhere no
    # config looked: Storybook booted fine, answered 200 on :6006, and served an
    # empty catalogue with "No story files found for the specified pattern".
    volumes:
      - ../storybook/.storybook:/app/.storybook
      - ../design-system/src:/design-system/src
    ports:
      - "6006:6006"
    extra_hosts:
      - "host.docker.internal:host-gateway"
