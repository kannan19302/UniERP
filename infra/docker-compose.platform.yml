          target: /app/src
        - action: sync
          path: ../tenant-sites/public
          target: /app/public
        - action: sync
          path: ../tenant-sites/middleware.ts
          target: /app/middleware.ts
        - action: sync
          path: ../tenant-sites/next.config.mjs
          target: /app/next.config.mjs
    ports:
      - "4004:4004"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
      idp:
        condition: service_started

  # ════════════════════════════════════════════════════════════════════════
  # PLATFORM 5 — Web Studio (port 4005)
  # ════════════════════════════════════════════════════════════════════════

  web-studio:
    build:
      context: ../web-studio
      target: dev
