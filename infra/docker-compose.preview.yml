name: unierp-local-preview

services:
  preview-runtime:
    build:
      context: ./preview-runtime
    container_name: unierp-local-preview-runtime
    restart: unless-stopped
    environment:
      PORT: "4018"
      CONTROL_PLANE_URL: http://host.docker.internal:3001
    ports:
      - "127.0.0.1:4018:4018"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4018/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    networks:
      - preview-egress

networks:
  preview-egress:
    name: unierp-local-preview-egress
