name: Mobile CI

# Phase 0.0 prerequisite (.ai/MULTI_CLIENT_MASTER_PLAN.md § 7): the mobile
# client builds and analyzes cleanly before any module's cross-platform
# Parity Phase (§ 4) can claim mobile/desktop credit. Android + Windows
# first (no code-signing complexity); iOS/macOS added once Apple signing is
# set up; Linux last.
#
# I01/D137: this workflow used to filter on `apps/mobile/**` and run with
# `working-directory: apps/mobile` — a monorepo path from before the
# platform split into 30 repositories. unierp-mobile is now its own
# top-level repo (lib/, test/, android/, etc. live at ITS OWN root), so
# every trigger path and working-directory below assumed a directory that
# has not existed since the split — this workflow could never have fired
# correctly for the repo it exists to protect. Confirmed separately that
# unierp-mobile's own ci.yml never called this workflow at all; it called
# the generic Node/pnpm `reusable-ci.yml` instead, which has nothing to act
# on in a repo with no package.json — so this Flutter client had no real CI
# coverage of any kind before this phase, from either angle.
#
# Reusable so unierp-mobile's own ci.yml can call it directly — the same
# pattern already used by every other repo's ci.yml in this platform.

on:
  workflow_call: {}

env:
  FLUTTER_VERSION: "3.27.0"

jobs:
  analyze:
    name: Analyze + unit/widget tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --coverage

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --debug

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: analyze
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --debug

  build-ios:
    name: Build iOS (no signing)
    runs-on: macos-latest
    needs: analyze
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --no-codesign --debug

  # macOS/Linux platform folders are not yet scaffolded in unierp-mobile
  # (flutter create --platforms=macos,linux . must be run locally — the
  # Flutter SDK is not available in any sandboxed dev environment this
  # platform's agents have run in so far). Uncomment these jobs once the
  # platform folders land.
